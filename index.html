<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Multi-IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
        }
        
        .sidebar {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 300px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        
        .sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .new-chat-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .conversation-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .conversation-item:hover {
            background: #e8e8e8;
        }
        
        .conversation-item.active {
            background: #667eea;
            color: white;
            border-color: #764ba2;
        }
        
        .conversation-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-meta {
            font-size: 11px;
            opacity: 0.7;
        }
        
        .conversation-item.active .conversation-meta {
            opacity: 0.9;
        }
        
        .delete-btn {
            float: right;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .delete-btn:hover {
            background: #cc0000;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .control-group label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        select {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        select option {
            background: #667eea;
            color: white;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message-info {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        #sendButton:hover {
            transform: scale(1.05);
        }
        
        #sendButton:active {
            transform: scale(0.95);
        }
        
        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: flex;
            gap: 5px;
            padding: 15px;
        }
        
        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin: 10px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Conversas</h2>
                <button class="new-chat-btn" onclick="createNewConversation()">+ Nova Conversa</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="empty-state">Sem conversas ainda</div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <h1>🤖 Chatbot Multi-IA</h1>
                <div class="controls">
                    <div class="control-group">
                        <label>Provedor</label>
                        <select id="providerSelect">
                            <option value="claude">Claude</option>
                            <option value="chatgpt">ChatGPT</option>
                            <option value="gemini">Google Gemini</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Personalidade</label>
                        <select id="personalitySelect">
                            <option value="normal">Normal</option>
                            <option value="turbinado">Turbinado</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="chat-area" id="chatArea">
                <div class="message assistant">
                    <div class="message-content">
                        Olá! Eu sou seu assistente Multi-IA. Escolha o provedor e a personalidade que prefere e comece a conversar! 😊
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                >
                <button id="sendButton">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Estado global
        let conversations = [];
        let currentConversationId = null;
        let messages = [];

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
            setupEventListeners();
        });

        function setupEventListeners() {
            const sendBtn = document.getElementById('sendButton');
            const input = document.getElementById('messageInput');
            
            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        }

        // Criar nova conversa
        function createNewConversation() {
            const id = 'conv_' + Date.now();
            const newConv = {
                id: id,
                title: 'Nova Conversa',
                messages: [],
                provider: document.getElementById('providerSelect').value,
                personality: document.getElementById('personalitySelect').value,
                created: new Date().toISOString()
            };
            
            conversations.unshift(newConv);
            saveConversations();
            loadConversation(id);
            renderConversationsList();
        }

        // Carregar conversas
        function loadConversations() {
            const saved = localStorage.getItem('chatbot_conversations');
            if (saved) {
                conversations = JSON.parse(saved);
                renderConversationsList();
                if (conversations.length > 0) {
                    loadConversation(conversations[0].id);
                }
            }
        }

        // Salvar conversas
        function saveConversations() {
            localStorage.setItem('chatbot_conversations', JSON.stringify(conversations));
        }

        // Renderizar lista de conversas
        function renderConversationsList() {
            const list = document.getElementById('conversationsList');
            
            if (conversations.length === 0) {
                list.innerHTML = '<div class="empty-state">Sem conversas ainda</div>';
                return;
            }
            
            list.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}" 
                     onclick="loadConversation('${conv.id}')">
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${conv.id}')">🗑️</button>
                    <div class="conversation-title">${conv.title}</div>
                    <div class="conversation-meta">
                        ${conv.provider} • ${conv.personality} • ${conv.messages.length} msgs
                    </div>
                </div>
            `).join('');
        }

        // Carregar conversa
        function loadConversation(id) {
            const conv = conversations.find(c => c.id === id);
            if (!conv) return;
            
            currentConversationId = id;
            messages = conv.messages;
            
            document.getElementById('providerSelect').value = conv.provider;
            document.getElementById('personalitySelect').value = conv.personality;
            
            renderMessages();
            renderConversationsList();
        }

        // Deletar conversa
        function deleteConversation(id) {
            if (confirm('Deseja realmente excluir esta conversa?')) {
                conversations = conversations.filter(c => c.id !== id);
                saveConversations();
                
                if (currentConversationId === id) {
                    if (conversations.length > 0) {
                        loadConversation(conversations[0].id);
                    } else {
                        currentConversationId = null;
                        messages = [];
                        renderMessages();
                    }
                }
                
                renderConversationsList();
            }
        }

        // Enviar mensagem
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            // Criar conversa se não existir
            if (!currentConversationId) {
                createNewConversation();
            }
            
            const conv = conversations.find(c => c.id === currentConversationId);
            const provider = document.getElementById('providerSelect').value;
            const personality = document.getElementById('personalitySelect').value;
            
            // Atualizar título da conversa com primeira mensagem
            if (conv.messages.length === 0) {
                conv.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
            }
            
            // Adicionar mensagem do usuário
            const userMsg = {
                role: 'user',
                content: text,
                timestamp: new Date().toISOString()
            };
            
            messages.push(userMsg);
            conv.messages = messages;
            saveConversations();
            
            input.value = '';
            renderMessages();
            
            // Mostrar loading
            showLoading();
            
            // Simular resposta da IA
            setTimeout(() => {
                const response = generateResponse(text, provider, personality);
                const assistantMsg = {
                    role: 'assistant',
                    content: response,
                    timestamp: new Date().toISOString(),
                    provider: provider,
                    personality: personality
                };
                
                messages.push(assistantMsg);
                conv.messages = messages;
                saveConversations();
                
                hideLoading();
                renderMessages();
                renderConversationsList();
            }, 1500);
        }

        // Gerar resposta simulada
        function generateResponse(userText, provider, personality) {
            const responses = {
                claude: {
                    normal: [
                        "Entendo sua questão. Deixe-me ajudá-lo com isso de forma clara e objetiva.",
                        "Essa é uma pergunta interessante. Vou explicar da melhor forma possível.",
                        "Posso te ajudar com isso. Aqui está minha análise sobre o assunto."
                    ],
                    turbinado: [
                        "🚀 WOW! Essa é INCRÍVEL! Vou te dar a MELHOR resposta que você já viu!",
                        "💥 SENSACIONAL! Prepare-se para uma resposta ÉPICA sobre isso!",
                        "⚡ DEMAIS! Vou explodir sua mente com esta resposta TURBINADA!"
                    ]
                },
                chatgpt: {
                    normal: [
                        "Claro! Vou te ajudar com isso. Aqui está uma explicação detalhada.",
                        "Ótima pergunta! Deixe-me compartilhar algumas informações úteis.",
                        "Com certeza! Vou te fornecer uma resposta completa sobre isso."
                    ],
                    turbinado: [
                        "🔥 ISSO É REVOLUCIONÁRIO! Vou te mostrar uma perspectiva INCRÍVEL!",
                        "💫 FANTÁSTICO! Prepare-se para ter sua mente EXPLODIDA!",
                        "🌟 ESPETACULAR! Esta resposta vai MUDAR sua vida!"
                    ]
                },
                gemini: {
                    normal: [
                        "Vou processar sua solicitação e fornecer uma resposta precisa.",
                        "Analisando sua pergunta... Aqui está uma resposta detalhada.",
                        "Compreendi. Vou te dar uma explicação clara e útil."
                    ],
                    turbinado: [
                        "⭐ EXTRAORDINÁRIO! Vou desvendar TODOS os segredos para você!",
                        "🎯 PERFEITO! Prepare-se para a resposta mais PODEROSA!",
                        "🌈 MÁGICO! Vou te entregar uma resposta TRANSCENDENTAL!"
                    ]
                }
            };
            
            const opts = responses[provider][personality];
            return opts[Math.floor(Math.random() * opts.length)] + 
                   `\n\nSobre "${userText}": Esta é uma resposta simulada. Em um sistema real, aqui estaria a resposta gerada pela API da ${provider}.`;
        }

        // Renderizar mensagens
        function renderMessages() {
            const chatArea = document.getElementById('chatArea');
            
            if (messages.length === 0) {
                chatArea.innerHTML = `
                    <div class="message assistant">
                        <div class="message-content">
                            Olá! Eu sou seu assistente Multi-IA. Escolha o provedor e a personalidade que prefere e comece a conversar! 😊
                        </div>
                    </div>
                `;
                return;
            }
            
            chatArea.innerHTML = messages.map(msg => `
                <div class="message ${msg.role}">
                    <div class="message-content">
                        ${msg.content}
                        ${msg.provider ? `<div class="message-info">${msg.provider} - ${msg.personality}</div>` : ''}
                    </div>
                </div>
            `).join('');
            
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Loading
        function showLoading() {
            const chatArea = document.getElementById('chatArea');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="message-content">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            chatArea.appendChild(loadingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            document.getElementById('sendButton').disabled = true;
        }

        function hideLoading() {
            const loading = document.getElementById('loading-message');
            if (loading) loading.remove();
            document.getElementById('sendButton').disabled = false;
        }
    </script>
</body>
</html>
