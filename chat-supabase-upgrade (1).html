<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Multi-IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
        }
        
        .sidebar {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 300px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        
        .sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .new-chat-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .conversation-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .conversation-item:hover {
            background: #e8e8e8;
        }
        
        .conversation-item.active {
            background: #667eea;
            color: white;
            border-color: #764ba2;
        }
        
        .conversation-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-meta {
            font-size: 11px;
            opacity: 0.7;
        }
        
        .conversation-item.active .conversation-meta {
            opacity: 0.9;
        }
        
        .delete-btn {
            float: right;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .delete-btn:hover {
            background: #cc0000;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .control-group label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        select {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        select option {
            background: #667eea;
            color: white;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message-info {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        #sendButton:hover {
            transform: scale(1.05);
        }
        
        #sendButton:active {
            transform: scale(0.95);
        }
        
        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: flex;
            gap: 5px;
            padding: 15px;
        }
        
        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin: 10px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Sidebar com histórico -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Conversas</h2>
                <button class="new-chat-btn" onclick="createNewConversation()">+ Nova Conversa</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="empty-state">Carregando conversas...</div>
            </div>
        </div>

        <!-- Chat principal -->
        <div class="container">
            <div class="header">
                <h1>🤖 Chatbot Multi-IA</h1>
                <div class="controls">
                    <div class="control-group">
                        <label>Provedor</label>
                        <select id="providerSelect">
                            <option value="claude">Claude</option>
                            <option value="chatgpt">ChatGPT</option>
                            <option value="gemini">Google Gemini</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Personalidade</label>
                        <select id="personalitySelect">
                            <option value="normal">Normal</option>
                            <option value="turbinado">Turbinado</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="chat-area" id="chatArea">
                <div class="message assistant">
                    <div class="message-content">
                        Olá! Eu sou seu assistente Multi-IA. Escolha o provedor e a personalidade que prefere e comece a conversar! 😊
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                >
                <button id="sendButton">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIGURAÇÕES ==========
        // IMPORTANTE: Configure suas credenciais aqui
        const SUPABASE_URL = 'https://SEU_PROJETO.supabase.co';
        const SUPABASE_KEY = 'SUA_CHAVE_ANON_PUBLICA';
        const N8N_WEBHOOK_URL = 'https://SEU_N8N_URL.app.n8n.cloud/webhook/trak-ads-chat';
        
        // Inicializa Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // ========== VARIÁVEIS GLOBAIS ==========
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const providerSelect = document.getElementById('providerSelect');
        const personalitySelect = document.getElementById('personalitySelect');
        const conversationsList = document.getElementById('conversationsList');
        
        let currentConversationId = null;
        let conversationHistory = [];
        let isLoading = false;
        
        // ========== FUNÇÕES DO SUPABASE ==========
        
        async function loadConversations() {
            try {
                const { data, error } = await supabaseClient
                    .from('conversations')
                    .select('*')
                    .order('updated_at', { ascending: false });
                
                if (error) throw error;
                
                displayConversations(data || []);
            } catch (error) {
                console.error('Erro ao carregar conversas:', error);
                showError('Erro ao carregar conversas');
            }
        }
        
        function displayConversations(conversations) {
            if (conversations.length === 0) {
                conversationsList.innerHTML = '<div class="empty-state">Nenhuma conversa ainda.<br>Clique em "Nova Conversa"</div>';
                return;
            }
            
            conversationsList.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}" 
                     onclick="loadConversation('${conv.id}')">
                    <div class="conversation-title">
                        ${conv.title}
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${conv.id}')">×</button>
                    </div>
                    <div class="conversation-meta">
                        ${conv.provider} | ${conv.personality} | ${new Date(conv.updated_at).toLocaleDateString('pt-BR')}
                    </div>
                </div>
            `).join('');
        }
        
        async function createNewConversation() {
            try {
                const provider = providerSelect.value;
                const personality = personalitySelect.value;
                
                const { data, error } = await supabase
                    .from('conversations')
                    .insert([{
                        title: `Conversa ${new Date().toLocaleString('pt-BR')}`,
                        provider: provider,
                        personality: personality
                    }])
                    .select()
                    .single();
                
                if (error) throw error;
                
                currentConversationId = data.id;
                conversationHistory = [];
                chatArea.innerHTML = `
                    <div class="message assistant">
                        <div class="message-content">
                            Nova conversa iniciada! Como posso ajudar? 😊
                        </div>
                    </div>
                `;
                
                await loadConversations();
                messageInput.focus();
            } catch (error) {
                console.error('Erro ao criar conversa:', error);
                showError('Erro ao criar nova conversa');
            }
        }
        
        async function loadConversation(conversationId) {
            try {
                currentConversationId = conversationId;
                
                // Carrega mensagens da conversa
                const { data: messages, error } = await supabase
                    .from('messages')
                    .select('*')
                    .eq('conversation_id', conversationId)
                    .order('created_at', { ascending: true });
                
                if (error) throw error;
                
                // Carrega informações da conversa
                const { data: conversation } = await supabase
                    .from('conversations')
                    .select('*')
                    .eq('id', conversationId)
                    .single();
                
                if (conversation) {
                    providerSelect.value = conversation.provider;
                    personalitySelect.value = conversation.personality;
                }
                
                // Limpa chat e reconstrói histórico
                chatArea.innerHTML = '';
                conversationHistory = [];
                
                messages.forEach(msg => {
                    addMessage(msg.content, msg.role, '', false);
                    conversationHistory.push({
                        role: msg.role,
                        content: msg.content
                    });
                });
                
                await loadConversations();
                messageInput.focus();
            } catch (error) {
                console.error('Erro ao carregar conversa:', error);
                showError('Erro ao carregar conversa');
            }
        }
        
        async function saveMessage(role, content) {
            if (!currentConversationId) return;
            
            try {
                const { error } = await supabase
                    .from('messages')
                    .insert([{
                        conversation_id: currentConversationId,
                        role: role,
                        content: content
                    }]);
                
                if (error) throw error;
                
                // Atualiza timestamp da conversa
                await supabase
                    .from('conversations')
                    .update({ updated_at: new Date().toISOString() })
                    .eq('id', currentConversationId);
                
            } catch (error) {
                console.error('Erro ao salvar mensagem:', error);
            }
        }
        
        async function deleteConversation(conversationId) {
            if (!confirm('Deseja realmente excluir esta conversa?')) return;
            
            try {
                const { error } = await supabase
                    .from('conversations')
                    .delete()
                    .eq('id', conversationId);
                
                if (error) throw error;
                
                if (conversationId === currentConversationId) {
                    currentConversationId = null;
                    conversationHistory = [];
                    chatArea.innerHTML = `
                        <div class="message assistant">
                            <div class="message-content">
                                Conversa excluída. Crie uma nova conversa para começar! 😊
                            </div>
                        </div>
                    `;
                }
                
                await loadConversations();
            } catch (error) {
                console.error('Erro ao excluir conversa:', error);
                showError('Erro ao excluir conversa');
            }
        }
        
        // ========== FUNÇÕES DE INTERFACE ==========
        
        function addMessage(content, type, info = '', save = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            if (info) {
                const infoDiv = document.createElement('div');
                infoDiv.className = 'message-info';
                infoDiv.textContent = info;
                contentDiv.appendChild(infoDiv);
            }
            
            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            if (save && currentConversationId) {
                saveMessage(type, content);
            }
        }
        
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content loading';
            contentDiv.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';
            
            loadingDiv.appendChild(contentDiv);
            chatArea.appendChild(loadingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }
        
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = `❌ Erro: ${message}`;
            chatArea.appendChild(errorDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            setTimeout(() => errorDiv.remove(), 5000);
        }
        
        // ========== FUNÇÃO PRINCIPAL DE ENVIO ==========
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;
            
            if (!currentConversationId) {
                await createNewConversation();
            }
            
            const provider = providerSelect.value;
            const personality = personalitySelect.value;
            
            // Adiciona mensagem do usuário
            addMessage(message, 'user');
            messageInput.value = '';
            
            // Adiciona ao histórico
            conversationHistory.push({
                role: 'user',
                content: message
            });
            
            // Mostra loading
            isLoading = true;
            sendButton.disabled = true;
            showLoading();
            
            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        provider: provider,
                        personality: personality,
                        history: conversationHistory.slice(-10)
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                hideLoading();
                
                if (data.success || data.message) {
                    const aiMessage = data.message || data.response || 'Resposta recebida';
                    const info = `${provider} | ${personality}`;
                    addMessage(aiMessage, 'assistant', info);
                    
                    // Adiciona resposta ao histórico
                    conversationHistory.push({
                        role: 'assistant',
                        content: aiMessage
                    });
                    
                    // Recarrega lista de conversas para atualizar timestamp
                    await loadConversations();
                } else {
                    showError('Resposta inválida do servidor');
                }
                
            } catch (error) {
                hideLoading();
                showError(error.message || 'Erro ao enviar mensagem');
                console.error('Erro:', error);
            } finally {
                isLoading = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }
        
        // ========== EVENT LISTENERS ==========
        
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // ========== INICIALIZAÇÃO ==========
        
        window.addEventListener('load', async () => {
            await loadConversations();
            messageInput.focus();
        });
    </script>
</body>
</html>
